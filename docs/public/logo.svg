<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Transparent SpaceShield Brand Vector Logo -->
  <g fill="currentColor">
    <!-- Shield Container -->
    <path d="M 50 20 C 65 20 78 24 78 45 C 78 68 50 82 50 82 C 50 82 22 68 22 45 C 22 24 35 20 50 20 Z" 
          fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Concentric Target Rings Inside Shield -->
    <circle cx="50" cy="46" r="18" fill="none" stroke="currentColor" stroke-width="5" />
    <circle cx="50" cy="46" r="10" fill="none" stroke="currentColor" stroke-width="4" />
    <circle cx="50" cy="46" r="4.5" fill="currentColor" />

    <!-- Diagonal Satellite Antenna / Beam Bar -->
    <path d="M 16 70 L 74 24" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none" />
    
    <!-- Top-Right Antenna Satellite Knob -->
    <circle cx="78" cy="21" r="5" fill="currentColor" />
  </g>
</svg>
